
<!DOCTYPE html>
<!-- Ejercicio 8.5: ej08_05.html -->
<html>
<head>
    <meta charset="utf-8">
    <title>Misterio</title>
</head>
<body>

<script>
    document.writeln("<table border='1'>");

    for (var i = 1; i <= 10; i++) {
        document.writeln("<tr>");

        for (var j = 1; j <= 5; j++) {
            document.writeln("<td>" + ((i - 1) * 5 + j) + "</td>");
        }

        document.writeln("</tr>");
    }

    document.writeln("</table>");
</script>

</body>
</html>
