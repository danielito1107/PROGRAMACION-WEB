
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicios de JavaScript</title>
    <script>
        // a) Suma
        var suma = 0;

        for (var cuenta = 1; cuenta <= 99; cuenta += 2)
            suma += cuenta;

        document.writeln("a) La suma es: " + suma + "<br>");

        // b) Potencia
        document.writeln("b) " + Math.pow(2.5, 3) + "<br>");

        // c) Ciclo while
        var x = 1;

        document.writeln("c) ");

        while (x <= 20) {
            document.write(x + " ");

            if (x % 5 == 0)
                document.write("<br>");

            ++x;
        }

        // d) Ciclo for
        document.writeln("<br>d) ");

        for (var x = 1; x <= 20; ++x) {
            document.write(x + " ");

            if (x % 5 == 0)
                document.write("<br>");
        }
    </script>
</head>
<body></body>
</html>
